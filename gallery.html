<div class="modal gallery-lightbox" id="galleryLightbox" aria-hidden="true">
  <div class="modal__backdrop" id="galleryBackdrop"></div>
  <div class="gallery-lightbox__dialog" role="dialog" aria-modal="true" aria-labelledby="galleryLightboxTitle">
    <button class="modal__close" id="galleryClose" type="button" aria-label="Close expanded image">&#10005;</button>
    <img class="gallery-lightbox__image" id="galleryLightboxImage" src="" alt="">
    <p class="gallery-lightbox__title" id="galleryLightboxTitle"></p>
  </div>
</div>

<footer class="footer">
  <div class="section-inner footer__grid">
    <div class="footer__brand">
      <span class="navbar__logo-text">THE FOREX TRADER <strong>KOUSHIK</strong></span>

    </div>
    <nav class="footer__links" aria-label="Footer">

    </nav>
    <p class="footer__copyright">&#169; 2026 The Trader Koushik. All rights reserved.</p>
  </div>
</footer>
<script>
  const lightbox = document.getElementById("galleryLightbox");
  const lightboxImage = document.getElementById("galleryLightboxImage");
  const lightboxTitle = document.getElementById("galleryLightboxTitle");
  const closeLightbox = () => {
    lightbox.classList.remove("is-open");
    lightbox.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  };
  document.querySelectorAll(".gallery-tile").forEach((tile) => tile.addEventListener("click", () => {
    lightboxImage.src = tile.dataset.image;
    lightboxImage.alt = tile.dataset.title;
    lightboxTitle.textContent = tile.dataset.title;
    lightbox.classList.add("is-open");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
  }));
  document.getElementById("galleryClose").addEventListener("click", closeLightbox);
  document.getElementById("galleryBackdrop").addEventListener("click", closeLightbox);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && lightbox.classList.contains("is-open")) closeLightbox();
  });
</script>
</body>
</html>
